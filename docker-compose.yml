services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: spool
      POSTGRES_USER: spool
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spool"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
    command: >
      sh -c "python manage.py migrate &&
             python manage.py bootstrap_admin &&
             gunicorn spool.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --threads ${GUNICORN_THREADS:-2}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    env_file: .env
    volumes:
      - media_data:/app/media
    # Every periodic/on-demand task here does blocking network I/O
    # (TMDB/Trakt/Simkl/Nuvio/MDBList calls) - Celery's own per-CPU-core
    # default concurrency can leave a slow sync serializing behind other
    # queued work on a small instance, so this is explicit rather than
    # left at the default like GUNICORN_WORKERS/THREADS above.
    command: celery -A spool worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY:-4}

  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    env_file: .env
    command: >
      sh -c "python manage.py bootstrap_periodic_tasks &&
             celery -A spool beat -l info"

volumes:
  db_data:
  redis_data:
  media_data:
