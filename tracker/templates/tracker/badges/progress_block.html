{# The filled progress block (the same style as a list's progress). context: b (dict: percent, headline, sub, side_title, side_sub, fill (CSS colour), label) #}
<div class="relative overflow-hidden rounded-lg bg-base-300 h-[4.5rem]" role="img" aria-label="{{ b.label }}">
  {% if b.percent %}<div class="absolute inset-y-0 left-0" style="width: {{ b.percent }}%; background: {{ b.fill }}"></div>{% endif %}
  <div class="relative h-full flex items-center justify-between gap-3 px-4">
    <div class="min-w-0">
      <div class="font-mono font-semibold text-xl leading-none">{{ b.headline }}</div>
      {% if b.sub %}<div class="font-mono text-[12.5px] mt-1.5 text-white">{{ b.sub }}</div>{% endif %}
    </div>
    <div class="text-right min-w-0 text-[12.5px]">
      <div class="font-semibold">{{ b.side_title }}</div>
      <div class="font-mono mt-0.5 text-ink-dim">{{ b.side_sub }}</div>
    </div>
  </div>
</div>
