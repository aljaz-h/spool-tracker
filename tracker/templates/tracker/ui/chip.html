{% load icons %}{# ui_chip: see templatetags/ui.py #}
{% if removable %}<button type="button" class="filter-chip" aria-label="{{ remove_label }}" {{ attrs }}>{{ label }} {% icon "x" "w-3 h-3" %}</button>{% elif href %}<a href="{{ href }}" class="fchip"{% if selected %} aria-current="true"{% endif %} {{ attrs }}>{% if check and selected %}{% icon "check" "w-3.5 h-3.5" %}{% endif %}{% if dot_class %}<span class="fchip-dot {{ dot_class }}" aria-hidden="true"></span>{% elif dot_color %}<span class="fchip-dot" style="background: {{ dot_color }}" aria-hidden="true"></span>{% endif %}{{ label }}{% if count is not None %} <span class="fchip-count">{{ count }}</span>{% endif %}</a>{% else %}<button type="button" class="fchip" aria-pressed="{% if selected %}true{% else %}false{% endif %}" {{ attrs }}>{% if check and selected %}{% icon "check" "w-3.5 h-3.5" %}{% endif %}{% if dot_class %}<span class="fchip-dot {{ dot_class }}" aria-hidden="true"></span>{% elif dot_color %}<span class="fchip-dot" style="background: {{ dot_color }}" aria-hidden="true"></span>{% endif %}{{ label }}{% if count is not None %} <span class="fchip-count">{{ count }}</span>{% endif %}</button>{% endif %}
