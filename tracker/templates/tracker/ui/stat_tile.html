{# ui_stat_tile: a figure, white and mono, never amber #}
<div class="stat-tile">
  <div class="stat-value">{{ value }}{% if unit %} <span class="stat-unit">{{ unit }}</span>{% endif %}</div>
  <div class="stat-label">{{ label }}</div>
  {% if note %}<div class="stat-note">{{ note }}</div>{% endif %}
  {% if percent is not None %}<div class="progress-track mt-2" aria-hidden="true"><div class="progress-fill progress-fill-neutral" style="width: {{ percent }}%"></div></div>{% endif %}
</div>
