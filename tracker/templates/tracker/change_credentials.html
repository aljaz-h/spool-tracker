{% load static %}
<!doctype html>
<html lang="en" data-theme="spool">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set your credentials · Spool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'dist/app.css' %}">
</head>
<body class="bg-base-100 text-base-content min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-sm bg-base-200 rounded-2xl p-8 shadow-[0_24px_64px_rgba(0,0,0,0.5)]">
    <div class="font-brand text-[36px] leading-none text-marquee">SPOOL</div>
    <p class="text-ink-dim text-sm mt-1 mb-6">
      You're signed in with the temporary admin credentials from setup. Choose your own username and password to continue.
    </p>


    <form method="post">
      {% csrf_token %}
      <label class="block text-xs text-ink-dim mb-1" for="id_username">New username</label>
      <input type="text" name="username" id="id_username" autofocus required
             class="input w-full mb-4">
      <label class="block text-xs text-ink-dim mb-1" for="id_password">New password</label>
      <input type="password" name="password" id="id_password" required minlength="8"
             class="input w-full mb-4">
      <label class="block text-xs text-ink-dim mb-1" for="id_confirm_password">Confirm new password</label>
      <input type="password" name="confirm_password" id="id_confirm_password" required minlength="8"
             class="input w-full mb-6">
      <button type="submit" class="btn btn-primary w-full">Save and continue</button>
    </form>
  </div>
  {% include "tracker/partials/toasts.html" %}
</body>
</html>
