{% load static %}
<!doctype html>
<html lang="en" data-theme="spool">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Spool{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon-16.png' %}">
  <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'dist/app.css' %}">
  <script defer src="{% static 'vendor/htmx.js' %}"></script>
  <script defer src="{% static 'vendor/alpinejs.js' %}"></script>
  <script>
    // document, not document.body — this script runs while <head> is still
    // parsing, before <body> exists; the event bubbles up to document anyway.
    document.addEventListener('htmx:configRequest', (e) => {
      e.detail.headers['X-CSRFToken'] = document.cookie.match(/csrftoken=([^;]+)/)?.[1] || '';
    });
    // FLIP ("First, Last, Invert, Play") reorder animation - records each
    // of container's children's on-screen position (skipping `skip`, e.g.
    // the item actively being dragged - it gets its own CSS transform for
    // the "lifted" look, see .list-item-dragging, and fighting over the
    // same inline style with this function would cancel that out on every
    // flip), runs `mutate` (which actually changes the DOM order), then
    // for every recorded child that moved, snaps it back to its old spot
    // with a transform and animates that transform away to zero - so
    // items slide to their new positions instead of jumping there. Lives
    // here (not colocated with its only caller, list_detail_items.html)
    // because that partial gets re-swapped by htmx on every filter
    // change/reorder - a <script> inside it would re-run and redeclare
    // this on every swap, whereas base.html only ever loads once.
    window.flipReorder = (container, mutate, skip) => {
      const before = new Map([...container.children].filter((el) => el !== skip).map((el) => [el, el.getBoundingClientRect()]));
      mutate();
      for (const [el, prev] of before) {
        const next = el.getBoundingClientRect();
        const dx = prev.left - next.left;
        const dy = prev.top - next.top;
        if (!dx && !dy) continue;
        el.style.transition = 'none';
        el.style.transform = `translate(${dx}px, ${dy}px)`;
        requestAnimationFrame(() => {
          el.style.transition = 'transform 220ms ease';
          el.style.transform = '';
        });
      }
    };
    // Shared styled-<dialog> replacement for the browser's own native
    // confirm() popup - resolves true/false once the dialog closes,
    // whichever way (Confirm click, Cancel click, backdrop click, Esc).
    // Used by the htmx:confirm handler below (covers every hx-confirm in
    // the app: history delete, bulk delete, the watched button's rewatch
    // guard, ...) and directly by the odd plain (non-htmx) form that
    // needs the same guard, like title_detail's own "Mark as Watched".
    window.confirmModal = (question) => {
      return new Promise((resolve) => {
        const modal = document.getElementById('confirm_modal');
        document.getElementById('confirm-modal-message').textContent = question;
        const confirmBtn = document.getElementById('confirm-modal-confirm-btn');
        let confirmed = false;
        const onConfirm = () => { confirmed = true; modal.close(); };
        const onClose = () => { confirmBtn.removeEventListener('click', onConfirm); resolve(confirmed); };
        confirmBtn.addEventListener('click', onConfirm, { once: true });
        modal.addEventListener('close', onClose, { once: true });
        modal.showModal();
      });
    };
    // htmx's documented custom-confirm recipe: intercept the cancelable
    // htmx:confirm event and only call issueRequest(true) (proceeding
    // with the original request) once the dialog above resolves true.
    document.addEventListener('htmx:confirm', (e) => {
      if (!e.detail.question) return;
      e.preventDefault();
      window.confirmModal(e.detail.question).then((ok) => { if (ok) e.detail.issueRequest(true); });
    });
  </script>
</head>
<body class="bg-base-100 text-base-content min-h-screen">
  <div x-data="{ sidebarOpen: false, mobileSearchOpen: false }">
    {% include "tracker/partials/sidebar.html" %}
    <div class="min-h-screen flex flex-col">
      {% include "tracker/partials/topbar.html" %}
      <main class="p-4 sm:p-6 lg:p-8 pb-16 lg:px-[calc(2rem+10%)]">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <dialog id="confirm_modal" class="modal">
    <div class="modal-box bg-base-200 border border-line rounded-2xl p-5 max-w-sm">
      <div id="confirm-modal-message" class="text-sm leading-relaxed mb-5"></div>
      <div class="flex gap-2.5 justify-end">
        <form method="dialog"><button type="submit" class="btn btn-sm btn-soft">Cancel</button></form>
        <button type="button" id="confirm-modal-confirm-btn" class="btn btn-sm btn-error">Confirm</button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop bg-black/60 backdrop-blur-sm"><button>close</button></form>
  </dialog>
</body>
</html>
