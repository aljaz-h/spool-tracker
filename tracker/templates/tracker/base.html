{% load static %}
<!doctype html>
<html lang="en" data-theme="spool">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Spool{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'img/favicon-32.png' %}">
  <link rel="icon" type="image/png" sizes="16x16" href="{% static 'img/favicon-16.png' %}">
  <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'dist/app.css' %}">
  <script defer src="{% static 'vendor/htmx.js' %}"></script>
  <script defer src="{% static 'vendor/alpinejs.js' %}"></script>
  <script>
    // document, not document.body — this script runs while <head> is still
    // parsing, before <body> exists; the event bubbles up to document anyway.
    document.addEventListener('htmx:configRequest', (e) => {
      e.detail.headers['X-CSRFToken'] = document.cookie.match(/csrftoken=([^;]+)/)?.[1] || '';
    });
  </script>
</head>
<body class="bg-base-100 text-base-content min-h-screen">
  <div x-data="{ sidebarOpen: false }">
    {% include "tracker/partials/sidebar.html" %}
    <div class="min-h-screen flex flex-col">
      {% include "tracker/partials/topbar.html" %}
      <main class="p-8 pb-16">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
</body>
</html>
