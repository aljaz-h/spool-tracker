{# context: provider (str), account (ExternalAccount) #}
<form method="post" action="{% url 'save_sync_schedule' provider %}" class="flex items-center gap-1.5 flex-wrap mt-2 pt-2 border-t border-line">
  {% csrf_token %}
  <span class="text-[11px] text-ink-dim">Sync every</span>
  <input type="number" name="sync_interval_days" min="1" max="30" value="{{ account.sync_interval_days }}" class="input input-xs w-12 bg-base-100 px-1.5">
  <span class="text-[11px] text-ink-dim">day(s) at</span>
  <input type="time" name="sync_time" value="{{ account.sync_hour|stringformat:'02d' }}:{{ account.sync_minute|stringformat:'02d' }}" class="input input-xs bg-base-100 px-1.5">
  <button type="submit" class="btn btn-xs">Save</button>
</form>
