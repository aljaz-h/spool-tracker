{# context: provider (str), account (ExternalAccount) #}
<div class="mt-2 pt-2 border-t border-line">
  <div class="flex items-center justify-between gap-2 mb-1.5">
    <div class="text-[11px] text-ink-faint">
      Last synced: {% if account.last_synced_at %}{{ account.last_synced_at|timesince }} ago{% else %}never{% endif %}
    </div>
    <form method="post" action="{% url 'trigger_manual_sync' provider %}">
      {% csrf_token %}
      <button type="submit" class="btn btn-xs btn-soft">Sync now</button>
    </form>
  </div>
  <form method="post" action="{% url 'save_sync_schedule' provider %}" class="flex items-center gap-1.5 flex-wrap">
    {% csrf_token %}
    <span class="text-[11px] text-ink-dim">Sync every</span>
    <input type="number" name="sync_interval_days" min="1" max="30" value="{{ account.sync_interval_days }}" class="input input-xs w-12 bg-base-100 px-1.5">
    <span class="text-[11px] text-ink-dim">day(s) at</span>
    <input type="time" name="sync_time" value="{{ account.sync_hour|stringformat:'02d' }}:{{ account.sync_minute|stringformat:'02d' }}" class="input input-xs bg-base-100 px-1.5">
    <button type="submit" class="btn btn-xs btn-soft">Save</button>
    {% if provider == "trakt" %}
      <label class="flex items-center gap-1.5 text-[11px] text-ink-dim cursor-pointer w-full mt-1">
        <input type="checkbox" name="import_lists" class="checkbox checkbox-xs" {% if account.import_lists %}checked{% endif %}>
        Also import my Trakt lists (Watchlist + custom lists)
      </label>
    {% endif %}
  </form>
  <form method="post" action="{% url 'disconnect_provider' provider %}" onsubmit="return confirm('Disconnect {{ provider|title }}? Future syncs stop; history already imported stays.');" class="mt-1.5">
    {% csrf_token %}
    <button type="submit" class="text-[11px] text-ink-faint hover:text-error">Disconnect</button>
  </form>
</div>
