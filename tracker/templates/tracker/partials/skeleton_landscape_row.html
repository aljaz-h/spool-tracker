{# Placeholder for a row of 16:9 cards that loads late (Dashboard's Recently Watched): the section heading, then one row in the same landscape-row grid. context: heading #}
<section class="section" role="status" aria-busy="true">
  <span class="sr-only">Loading {{ heading }}</span>
  <div class="section-head"><h2 class="section-title">{{ heading }}</h2></div>
  <div class="landscape-row" aria-hidden="true">
    {% for _ in "abcdefghijkl" %}
      <div class="min-w-0">
        <div class="skel aspect-video w-full"></div>
        <div class="skel skel-line mt-2.5 w-3/4 !h-[14px]"></div>
        <div class="skel skel-line mt-1.5 w-1/2 !h-[12px]"></div>
      </div>
    {% endfor %}
  </div>
</section>
