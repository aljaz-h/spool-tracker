{% load icons %}
<header class="h-16 flex-none border-b border-line flex items-center justify-between px-7 bg-base-100 sticky top-0 z-30">
  <div class="flex items-center gap-3.5 flex-1 min-w-0">
    <button
      @click="sidebarOpen = !sidebarOpen"
      aria-label="Toggle sidebar"
      class="w-9 h-9 flex-none rounded-lg border border-line bg-base-200 flex items-center justify-center text-ink-dim hover:text-base-content hover:border-primary"
    >
      {% icon "menu" "w-[18px] h-[18px]" %}
    </button>
    <input
      class="bg-base-200 border border-line rounded-lg px-3.5 py-2 text-[13px] text-ink-dim max-w-[380px] w-full"
      placeholder="Search your library…"
    >
  </div>
  <div class="flex items-center gap-3.5 flex-none">
    <button class="btn btn-primary btn-sm">+ Add title</button>
    <div class="flex">
      {% for p in all_profiles %}
        {% if not active_profile or p.id != active_profile.id %}
          <button
            type="button"
            onclick="profile_popup_modal.showModal()"
            hx-get="{% url 'profile_popup' p.id %}"
            hx-target="#profile-popup-content"
            hx-swap="innerHTML"
            class="w-[30px] h-[30px] rounded-full flex items-center justify-center font-mono text-xs font-semibold border-2 border-base-100 -ml-2 first:ml-0 cursor-pointer"
            style="background:{{ p.avatar_color }};color:#fff;"
            title="{{ p.display_name }}"
          >{{ p.display_name|first|upper }}</button>
        {% endif %}
      {% endfor %}
    </div>
    {% if active_profile %}
      <div class="relative -ml-2" x-data="{ open: false }">
        <button
          @click="open = !open" @click.outside="open = false"
          class="w-[30px] h-[30px] rounded-full flex items-center justify-center font-mono text-xs font-semibold border-2 border-primary"
          style="background:{{ active_profile.avatar_color }};color:#fff;"
          title="{{ active_profile.display_name }}"
        >{{ active_profile.display_name|first|upper }}</button>
        <div x-show="open" x-cloak class="absolute right-0 mt-2 w-44 bg-base-200 border border-line rounded-lg shadow-lg z-40 py-1">
          <div class="px-3 py-2 text-xs text-ink-dim border-b border-line truncate">{{ active_profile.display_name }}</div>
          <a href="{% url 'my_profile' %}" class="block px-3 py-2 text-sm hover:bg-base-300">My Profile</a>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="w-full text-left px-3 py-2 text-sm hover:bg-base-300">Log out</button>
          </form>
        </div>
      </div>
    {% endif %}
  </div>

  <dialog id="profile_popup_modal" class="modal">
    <div class="modal-box bg-base-200 border border-line">
      <form method="dialog"><button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button></form>
      <div id="profile-popup-content">
        <div class="py-10 text-center text-ink-faint text-sm">Loading…</div>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>
</header>
