{# Placeholder for the title page's Household panel while partials/title_household.html loads: the summary line with its layout switch, then member rows (avatar, name and status, progress bar). #}
<div role="status" aria-busy="true">
  <span class="sr-only">Loading household</span>
  <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2 mb-3">
    <div class="skel skel-line w-56 !h-[14px]"></div>
    <div class="skel w-32 h-[30px] rounded-lg"></div>
  </div>
  <div class="rows divide-y divide-line">
    {% for _ in "ab" %}
      <div class="grid grid-cols-[auto_minmax(0,1fr)_auto] sm:grid-cols-[auto_minmax(7rem,1fr)_minmax(9rem,1.5fr)_minmax(6.5rem,auto)] items-center gap-x-3 gap-y-2 py-2.5">
        <span class="skel skel-round w-8 h-8 flex-none"></span>
        <div class="min-w-0"><div class="skel skel-line w-24 !h-[14px]"></div><div class="skel skel-line skel-round mt-1.5 w-16 !h-[18px]"></div></div>
        <div class="col-span-3 sm:col-span-1 order-last sm:order-none min-w-0"><div class="skel skel-round h-1.5"></div><div class="skel skel-line mt-2 w-2/3 !h-[12px]"></div></div>
        <div class="skel skel-line w-14 !h-[12px] justify-self-end"></div>
      </div>
    {% endfor %}
  </div>
</div>
