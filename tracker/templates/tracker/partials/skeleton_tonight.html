{# Placeholder for the Dashboard's "My Schedule" card while partials/schedule_tonight.html loads: the same eyebrow, big day word, summary line and slot rows (same classes, so the same sizes). #}
<div role="status" aria-busy="true">
  <span class="sr-only">Loading tonight's plan</span>
  <div class="skel skel-line w-20 !h-[13px]"></div>
  <div class="skel mt-1.5 w-40 h-[2.4rem]"></div>
  <div class="skel skel-line mt-2.5 w-56 !h-[13px]"></div>
  <div class="flex flex-col gap-2 mt-3.5">
    {% for _ in "ab" %}
      <div class="sch-tonight-row" style="--sch-c: var(--color-line)">
        <div class="sch-tonight-times gap-1"><span class="skel skel-line w-10 !h-[9px]"></span><span class="skel skel-line w-8 !h-[9px]"></span></div>
        <div class="sch-tonight-poster skel"></div>
        <div class="min-w-0 flex-1"><div class="skel skel-line w-3/4 !h-[14px]"></div><div class="skel skel-line mt-2 w-1/2 !h-[12px]"></div></div>
        <div class="flex flex-col gap-1 flex-none"><span class="skel w-6 h-6 rounded-md"></span><span class="skel w-6 h-6 rounded-md"></span></div>
      </div>
    {% endfor %}
  </div>
</div>
