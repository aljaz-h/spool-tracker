{% load icons %}
{# context: title, season, episode_number, watched (bool), id_suffix (str, optional - disambiguates the id when this partial renders more than once for the same episode, e.g. title_episodes.html's separate mobile/desktop layouts) #}
<button
  type="button"
  id="ep-watched-btn-{{ title.pk }}-{{ season }}-{{ episode_number }}{{ id_suffix }}"
  hx-post="{% url 'episode_mark_watched' title.pk season episode_number %}"
  hx-target="#ep-watched-btn-{{ title.pk }}-{{ season }}-{{ episode_number }}{{ id_suffix }}"
  hx-swap="outerHTML"
  hx-vals='{"id_suffix": "{{ id_suffix }}"}'
  {% if watched %}hx-confirm="Log another watch of S{{ season }}E{{ episode_number }}?"{% endif %}
  title="{% if watched %}Watched — log another watch{% else %}Mark as watched{% endif %}"
  class="w-7 h-7 rounded-full flex items-center justify-center border transition-colors flex-none
    {% if watched %}bg-success/90 border-success/60 text-success-content{% else %}bg-black/55 border-white/15 text-white/85 hover:bg-black/75 hover:border-white/30{% endif %}"
>{% icon "check" "w-3.5 h-3.5" %}</button>
