{# context: value, label, color_class (optional), value_size_class (optional - for a longer formatted value that would wrap/overflow at the default text-4xl) #}
<div class="bg-base-200 border border-line rounded-2xl p-4.5">
  <div class="font-display {{ value_size_class|default:"text-4xl" }} leading-none {{ color_class|default:"text-primary" }}">{{ value }}</div>
  <div class="text-xs text-ink-dim mt-1.5">{{ label }}</div>
</div>
