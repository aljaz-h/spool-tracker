{% load tracker_extras %}
{# context: item (dict: id, name, poster_url) - one TMDB collection in the Movies → Collections grid; same poster-first card shape as discover_tile.html. #}
<a href="{% url 'collection_detail' item.id %}" class="media-card block group">
  <div class="poster {% if not item.poster_url %}{{ item.id|gradient_class }}{% endif %}">
    {% if item.poster_url %}
      <img src="{{ item.poster_url|poster_size:"w342" }}" alt="" loading="lazy" class="absolute inset-0 group-hover:brightness-110">
    {% endif %}
  </div>
  <span class="media-title">{{ item.name }}</span>
  <span class="meta"><span>Collection</span></span>
</a>
