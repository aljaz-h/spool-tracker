{% load icons %}
<a href="{{ href }}"
   class="flex items-center gap-1.5 px-3.5 h-9 rounded-full text-[13px] font-medium transition-colors whitespace-nowrap
     {% if is_active %}bg-base-content text-base-100{% else %}text-ink-dim hover:text-base-content hover:bg-base-300{% endif %}"
>
  {% icon icon_name "w-[15px] h-[15px] flex-none opacity-85" %}
  <span>{{ label }}</span>
</a>
