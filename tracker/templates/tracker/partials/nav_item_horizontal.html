{% load icons %}
<a href="{{ href }}"
   class="flex items-center gap-2 px-3.5 h-full text-[13px] font-medium border-b-2 transition-colors whitespace-nowrap
     {% if is_active %}text-base-content {{ active_border }}{% else %}border-transparent text-ink-dim hover:text-base-content hover:border-line{% endif %}"
>
  {% icon icon_name "w-[15px] h-[15px] flex-none opacity-85" %}
  <span>{{ label }}</span>
</a>
