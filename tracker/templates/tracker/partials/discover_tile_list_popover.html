{% load icons tracker_extras %}
{# context: media_type (str), tmdb_id (int), my_lists (list of WatchList) - a not-yet-tracked preview title, so every list starts unchecked (nothing to remove yet - see title_preview_add_to_list) #}
<div class="relative flex-1" x-data="{
  open: false,
  togglePanel(button) {
    this.open = !this.open;
    if (!this.open) return;
    this.$nextTick(() => {
      const rect = button.getBoundingClientRect();
      const panel = this.$refs.panel;
      const width = 176;
      panel.style.left = Math.min(rect.left, window.innerWidth - width - 8) + 'px';
      panel.style.bottom = (window.innerHeight - rect.top + 6) + 'px';
    });
  },
}">
  <button
    type="button"
    @click="togglePanel($el)"
    :aria-expanded="open.toString()"
    aria-haspopup="true"
    title="Add to list"
    class="w-full h-9 flex items-center justify-center text-white/75 hover:text-white hover:bg-white/10 transition-colors"
  >{% icon "list-checks" "w-4 h-4" %}</button>
  <div
    x-ref="panel"
    x-show="open" x-cloak x-transition @click.outside="open = false" @scroll.window="open = false" @keydown.escape.window="open = false"
    class="fixed z-50 w-44 max-h-56 overflow-y-auto bg-base-200 border border-line rounded-lg p-1.5 shadow-xl"
  >
    {% for list in my_lists %}
      <button
        type="button"
        hx-post="{% url 'title_preview_add_to_list' media_type tmdb_id list.id %}"
        hx-target="closest div.relative"
        hx-swap="{{ "outerHTML"|animated_swap:active_profile.animations_enabled }}"
        class="btn btn-xs btn-soft w-full justify-between"
      >{{ list.name }} <span>+</span></button>
    {% empty %}
      <div class="text-[11px] text-ink-faint px-2 py-1.5">No lists yet.</div>
    {% endfor %}
  </div>
</div>
