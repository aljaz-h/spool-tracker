{# context: received_recommendations (list of Recommendation, pending, newest first) #}
{% if received_recommendations %}
  <div class="bg-base-200 border border-line rounded-2xl p-5 mt-6">
    <h2 class="text-lg mb-3">Recommended to you</h2>
    <div class="flex flex-col gap-1">
      {% for rec in received_recommendations %}
        <div class="flex items-center justify-between gap-3 py-2 {% if not forloop.last %}border-b border-line{% endif %}">
          <a href="{% url 'title_detail' rec.title.pk %}" class="text-[13px] min-w-0 truncate hover:underline">
            <b>{{ rec.from_profile.display_name }}</b> recommended <b>{{ rec.title.name }}</b>
          </a>
          <form hx-post="{% url 'dismiss_recommendation' rec.pk %}" hx-target="closest div.bg-base-200" hx-swap="outerHTML" class="flex-none">
            {% csrf_token %}
            <button type="submit" class="text-ink-faint hover:text-error text-sm leading-none px-1" title="Dismiss">&times;</button>
          </form>
        </div>
      {% endfor %}
    </div>
  </div>
{% endif %}
