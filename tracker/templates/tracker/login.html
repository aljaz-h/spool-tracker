{% load static icons %}
<!doctype html>
<html lang="en" data-theme="spool">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Spool</title>
  <link rel="icon" type="image/x-icon" href="{% static 'img/favicon.ico' %}">
  <link rel="apple-touch-icon" href="{% static 'img/apple-touch-icon.png' %}">
  <link rel="manifest" href="{% static 'img/manifest.webmanifest' %}">
  <meta name="theme-color" content="#0e1014">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'dist/app.css' %}">
  <script defer src="{% static 'vendor/alpinejs.js' %}"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
  </script>
</head>
<body class="bg-base-100 text-base-content min-h-screen flex flex-col items-center justify-center p-6">
  <div class="w-full max-w-sm bg-base-200 rounded-2xl p-8 shadow-[0_24px_64px_rgba(0,0,0,0.5)]" x-data="{ showPassword: false }">
    <div class="font-brand text-[36px] leading-none text-marquee">SPOOL</div>
    <p class="text-ink-dim text-sm mt-1 mb-6">Sign in to your household</p>

    <form method="post">
      {% csrf_token %}
      {% if form.errors %}
        <p class="text-error text-sm mb-3">Incorrect username or password.</p>
      {% endif %}

      <label class="block text-xs text-ink-dim mb-1" for="id_username">Username</label>
      <input
        type="text" name="username" id="id_username" autofocus required placeholder="e.g. jordan"
        class="input w-full mb-4"
      >

      <label class="block text-xs text-ink-dim mb-1" for="id_password">Password</label>
      <div class="relative mb-4">
        <input
          :type="showPassword ? 'text' : 'password'" name="password" id="id_password" required
          class="input w-full pr-10"
        >
        <button
          type="button" @click="showPassword = !showPassword" tabindex="-1" title="Show/hide password"
          class="absolute right-2.5 top-1/2 -translate-y-1/2 text-ink-faint hover:text-base-content"
        >
          <span x-show="!showPassword">{% icon "eye" "w-4 h-4" %}</span>
          <span x-show="showPassword" x-cloak>{% icon "eye-off" "w-4 h-4" %}</span>
        </button>
      </div>

      <div class="flex items-center justify-between mb-5">
        <label class="flex items-center gap-2 text-xs text-ink-dim cursor-pointer">
          <input type="checkbox" name="remember_me" checked class="checkbox checkbox-sm checkbox-primary">
          Keep me signed in
        </label>
        <span class="text-xs text-ink-dim">Need access?</span>
      </div>

      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-full">Sign in</button>
    </form>

    <div class="border-t border-dashed border-line my-5"></div>

    <p class="text-center text-xs text-ink-dim">Locked out? Ask a household admin to reset your password.</p>
  </div>

  <div class="mt-5 text-center text-[12.5px] text-ink-faint">
    spool.tracker &middot; v{{ app_version }} &middot; self-hosted
  </div>
</body>
</html>
