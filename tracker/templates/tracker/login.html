{% load static %}
<!doctype html>
<html lang="en" data-theme="spool">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in · Spool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Public+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'dist/app.css' %}">
</head>
<body class="bg-base-100 text-base-content min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-sm bg-base-200 border border-line rounded-2xl p-8">
    <div class="font-display text-3xl text-marquee tracking-wide">SPOOL</div>
    <p class="text-ink-dim text-sm mt-1 mb-6">Sign in to your household</p>

    <form method="post">
      {% csrf_token %}
      {% if form.errors %}
        <p class="text-error text-sm mb-3">Incorrect username or password.</p>
      {% endif %}
      <label class="block text-xs text-ink-dim mb-1" for="id_username">Username</label>
      <input type="text" name="username" id="id_username" autofocus required
             class="input w-full mb-4 bg-base-100">
      <label class="block text-xs text-ink-dim mb-1" for="id_password">Password</label>
      <input type="password" name="password" id="id_password" required
             class="input w-full mb-6 bg-base-100">
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-full">Sign in</button>
    </form>
  </div>
</body>
</html>
