{% extends "tracker/base.html" %}
{% block title %}Choose a Nuvio profile · Spool{% endblock %}
{% block content %}


  <div class="page-head !block">
    <h1 class="page-title">Choose a Nuvio profile</h1>
    <div class="text-ink-dim text-sm mt-1">{{ email }} has more than one profile — pick which one to sync from.</div>
  </div>

  <div class="surface p-5 max-w-md flex flex-col gap-2.5">
    {% for p in profiles %}
      <form method="post" action="{% url 'nuvio_select_profile' %}">
        {% csrf_token %}
        <input type="hidden" name="profile_index" value="{{ p.index }}">
        <button type="submit" class="btn btn-sm btn-soft w-full justify-start">{{ p.name }}</button>
      </form>
    {% endfor %}
  </div>

{% endblock %}
